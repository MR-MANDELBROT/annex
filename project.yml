# XcodeGen spec for the app. Generate the project with:  Tools/generate.sh
name: Annex
options:
  bundleIdPrefix: dev.marquart
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  AnnexKit:
    path: AnnexKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    DEVELOPMENT_TEAM: S3725YB7V6
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Annex:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "AppIcon.icon"
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: App/LaunchAgents/dev.marquart.annex.session.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: AnnexKit
        product: AnnexKit
      - package: SwiftTerm
      - package: Sparkle
      - target: annex-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: annex-session
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Annex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        NSLocalNetworkUsageDescription: "Annex connects to its workspace, a virtual Mac that macOS counts as a device on your local network. Nothing else on your network is contacted."
        NSHumanReadableCopyright: "© 2026 Maximilian Marquart"
        SUFeedURL: https://mr-mandelbrot.github.io/annex/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
        SUEnableInstallerLauncherService: false
    entitlements:
      path: App/Annex.entitlements
      properties:
        com.apple.security.virtualization: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.annex
        PRODUCT_NAME: Annex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  annex-mcp:
    type: tool
    platform: macOS
    sources:
      - path: AnnexKit/Sources/annex-mcp
    dependencies:
      - package: AnnexKit
        product: AnnexKit
    settings:
      base:
        PRODUCT_NAME: annex-mcp
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.annex.mcp
        SKIP_INSTALL: YES

  annex-session:
    type: tool
    platform: macOS
    sources:
      - path: AnnexKit/Sources/annex-session
    dependencies:
      - package: AnnexKit
        product: AnnexKit
    settings:
      base:
        PRODUCT_NAME: annex-session
        PRODUCT_BUNDLE_IDENTIFIER: dev.marquart.annex.session
        SKIP_INSTALL: YES
